name: Firmware validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Firmware host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile and run C++ host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nikos-host
          for source in \
            tools/tests/test_warsaw_time_rules.cpp \
            tools/tests/test_ent1_migration_contract.cpp \
            tools/tests/test_clock_utc_migration.cpp \
            tools/tests/test_rtc_utc_commit_failures.cpp \
            tools/tests/test_world_clock.cpp \
            tools/tests/test_mini_racer_race.cpp \
            tools/tests/test_space_defender_mission.cpp; do
            binary="/tmp/nikos-host/$(basename "${source%.cpp}")"
            g++ -std=c++17 -Wall -Wextra -Werror \
              -Icomponents/clock/include \
              -Icomponents/entertainment_guard/include \
              -Iapps/mini_racer/include \
              -Iapps/space_defender/include \
              "$source" -o "$binary"
            "$binary"
            echo "PASS: $source"
          done
      - name: Run remaining standalone C++ host regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nikos-host
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/tests/font_core_stubs \
            -Icomponents/font_core/include \
            tools/tests/font_core_test.cpp components/font_core/font_core.cpp \
            -o /tmp/nikos-host/font_core_test
          /tmp/nikos-host/font_core_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iapps/sound_meter/include \
            tools/tests/sound_meter_level_test.cpp apps/sound_meter/level_processor.cpp \
            -o /tmp/nikos-host/sound_meter_level_test
          /tmp/nikos-host/sound_meter_level_test
      - name: Test ENT3 storage with injected NVS failures
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/tests/ent3_stubs \
            -Icomponents/storage/include \
            tools/tests/test_ent3_storage.cpp \
            -o /tmp/nikos-host/test_ent3_storage
          /tmp/nikos-host/test_ent3_storage
      - name: Run repository Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/tests
          # All repository Python regressions are host-side source checks or
          # self-contained deterministic tests; no board, secrets or network.
          failed=0
          for test in tools/tests/test_*.py; do
            echo "Running $test"
            if python3 "$test"; then
              echo "PASS: $test"
            else
              echo "FAIL: $test"
              failed=$((failed + 1))
            fi
          done
          echo "Failed Python regression tests: $failed"
          test "$failed" -eq 0

  firmware:
    name: ESP-IDF 5.5.5 / ESP32 build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build baseline main and measure binary
        shell: bash
        run: |
          set -euo pipefail
          source "${IDF_PATH}/export.sh"
          git worktree add --detach /tmp/nikos-ent-baseline "origin/main"
          (cd /tmp/nikos-ent-baseline && idf.py build)
          app_bin="$(find /tmp/nikos-ent-baseline/build -maxdepth 1 -type f -name '*.bin' -print -quit)"
          test -n "$app_bin"
          stat -c '%s' "$app_bin" > /tmp/nikos-ent-baseline-size
      - name: Validate ESP-IDF 5.5.5 and compare binary size
        shell: bash
        run: |
          set -euo pipefail
          test "${IDF_PATH:+set}" = set
          source "${IDF_PATH}/export.sh"
          idf.py --version
          grep -q 'CONFIG_IDF_TARGET="esp32"' sdkconfig.defaults
          idf.py build
          app_bin="$(find build -maxdepth 1 -type f -name '*.bin' -print -quit)"
          test -n "$app_bin"
          before="$(cat /tmp/nikos-ent-baseline-size)"
          after="$(stat -c '%s' "$app_bin")"
          delta="$((after-before))"
          printf 'Firmware application binary: main=%s bytes, PR=%s bytes, delta=%+d bytes\\n' "$before" "$after" "$delta"
          {
            echo '### Firmware size (ESP-IDF 5.5.5)'
            echo "| main | PR | delta |"
            echo "| ---: | ---: | ---: |"
            echo "| $before B | $after B | $delta B |"
          } >> "$GITHUB_STEP_SUMMARY"
